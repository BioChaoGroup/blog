  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" letter-spacing="1.8">
    <text x="88" y="530" font-size="11" fill="#5f8794">MEAN-POOLED GENOME EMBEDDING</text>
  </g>

  <!-- arrow embedding -> readouts -->
  <path d="M394 470h24" stroke="#2f6a7a" stroke-width="2"/>
  <path d="M418 464l10 6-10 6z" fill="#2f6a7a"/>

