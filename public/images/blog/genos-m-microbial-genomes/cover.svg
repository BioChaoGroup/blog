<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Diagram of the Genos-m pipeline: a curated microbial genome corpus is tokenised, routed through 32 sparse experts, and frozen embeddings feed downstream readouts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07242d"/>
      <stop offset="0.55" stop-color="#041c24"/>
      <stop offset="1" stop-color="#062a35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#00b1d7" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#00b1d7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00b1d7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.9" r="0.62">
      <stop offset="0" stop-color="#c07a2a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c07a2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00b1d7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- header -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" letter-spacing="2.6">
    <text x="88" y="84" font-size="13" fill="#00b1d7">GENOS-M · HUMAN-ASSOCIATED MICROBES</text>
    <text x="1112" y="84" font-size="12" fill="#7c9ea9" text-anchor="end">PREPRINT · MAY 2026</text>
  </g>

  <!-- ============ PRETRAIN ============ -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" letter-spacing="3">
    <text x="88" y="132" font-size="12" fill="#7c9ea9">01 · PRETRAIN</text>
    <path d="M232 127h880" stroke="#14414e" stroke-width="1"/>
  </g>

  <!-- corpus -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" letter-spacing="2.2">
    <text x="88" y="176" font-size="12" fill="#9cc4cf">1.2T TOKENS · 69,056 SPECIES</text>
  </g>
  <rect x="88" y="196" width="292" height="26" rx="13" fill="#0a303c"/>
  <g>
