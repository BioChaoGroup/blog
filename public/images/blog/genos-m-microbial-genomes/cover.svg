    <rect x="440" y="224" width="20" height="20" rx="4" opacity="0.5"/>
    <rect x="468" y="224" width="20" height="20" rx="4" opacity="0.8"/>
    <rect x="496" y="224" width="20" height="20" rx="4" opacity="0.4"/>
