  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" letter-spacing="1.8">
    <text x="688" y="288" font-size="11" fill="#5f8794">SPARSE MoE · ROUTER PICKS 2</text>
  </g>

  <!-- stats right -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
    <text x="1032" y="212" font-size="34" fill="#00b1d7">4.7B</text>
    <text x="1032" y="230" font-size="9" fill="#7c9ea9" letter-spacing="1.4">TOTAL PARAMS</text>
    <text x="1032" y="270" font-size="22" fill="#6fe0f5">330M</text>
    <text x="1032" y="286" font-size="9" fill="#7c9ea9" letter-spacing="1.4">ACTIVE / PASS</text>
  </g>

